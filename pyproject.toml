[project]
name = "max-transport"
version = "0.1.0"
description = "XMPP external component that bridges MAX messenger (Prosody-compatible)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "MAX Transport" }]
keywords = ["xmpp", "max", "prosody", "gateway", "transport", "pymax"]
dependencies = [
    "maxapi-python>=2.4.1",
    "slixmpp>=1.8.5",
]

[project.scripts]
max-transport = "max_transport.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/max_transport"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
